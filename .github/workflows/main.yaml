name: Autograder Esonero 1

on:
  workflow_dispatch:
    inputs:
      matricola:
        description: 'Inserisci la tua matricola'
        required: true

jobs:
  grade:
    name: Esegui Grader
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Carica immagine Grader
        run: docker load -i lab-grader-esonero-1_1.0.1.tar.gz

      - name: Avvia il progetto
        working-directory: ./Esonero_1
        run: |
          docker compose up --build -d
          docker compose ps

      - name: Attendi backend pronto
        run: |
          echo "Attendo che FastAPI sia pronto su localhost:8003..."
          for i in {1..30}; do
            if curl -s http://localhost:8003 > /dev/null; then
              echo "Backend raggiungibile!"
              exit 0
            fi
            echo "Tentativo $i: backend non ancora pronto, riprovo in 2 secondi..."
            sleep 2
          done
          echo "Backend non ha risposto entro il tempo limite."
          exit 1

      - name: Diagnostica servizi (in caso di dubbi)
        working-directory: ./Esonero_1
        run: |
          docker compose ps
          docker compose logs backend --tail=50

      - name: Esegui Grader
        run: |
          docker run --rm \
            --network host \
            lab-grader-esonero-1:1.0.1 \
            ${{ github.event.inputs.matricola }}

      - name: Diagnostica fallimento
        if: failure()
        working-directory: ./Esonero_1
        run: |
          echo "=== DOCKER COMPOSE LOGS ==="
          docker compose logs
          echo "=== INSPECT ESONERO_BACKEND ==="
          docker inspect esonero_backend || true

      - name: Cleanup
        if: always()
        working-directory: ./Esonero_1
        run: docker compose down -v --remove-orphans