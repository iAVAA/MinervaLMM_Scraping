version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: esonero_backend
    ports:
      - "8003:8003"
    volumes:
      - ./backend:/app/backend
      - ./domains.json:/app/domains.json
      - ./gs_data:/app/gs_data
    environment:
      - PORT=8003
    networks:
      - esonero_network
      
  frontend:
    build:
      context: ./frontend
    container_name: esonero_frontend
    ports:
      - "8080:8080"
    volumes:
      - ./frontend:/app/frontend
    environment:
      - BACKEND_URL=http://backend:8003
    depends_on:
      - backend
    networks:
      - esonero_network

networks:
  esonero_network:
    driver: bridge
